version: 1
# Same build as the console spec, pinned to Node 26 (matches .nvmrc and CI).
backend:
  phases:
    preBuild:
      commands:
        - nvm install 26
        - nvm use 26
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 26
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
