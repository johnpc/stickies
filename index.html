<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stickies — a shared sticky-note pad at any URL</title>
    <meta
      name="description"
      content="Visit any room name and share text, links, and notes with anyone at the same URL. No account, no setup."
    />

    <!-- Social unfurl (OpenGraph + Twitter). Sharing a room link is the app's
         whole invite loop, so a link pasted into Slack/iMessage/Discord/Twitter
         should preview cleanly. SPA served statically → app-level (not per-room)
         tags with absolute URLs so crawlers resolve them without running JS. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stickies" />
    <meta property="og:title" content="Stickies — a shared sticky-note pad at any URL" />
    <meta
      property="og:description"
      content="Visit any room name and share text, links, and notes with anyone at the same URL. No account, no setup."
    />
    <meta property="og:url" content="https://stickies.jpc.io/" />
    <!-- 1200×630 (1.91:1) PNG generated by scripts/gen-og-image.mjs. The explicit
         type + dimensions let crawlers render the card before fetching the bytes
         and avoid a first-paste "no image" race. -->
    <meta property="og:image" content="https://stickies.jpc.io/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stickies — a shared sticky pad at any URL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stickies — a shared sticky-note pad at any URL" />
    <meta
      name="twitter:description"
      content="Visit any room name and share text, links, and notes with anyone at the same URL. No account, no setup."
    />
    <meta name="twitter:image" content="https://stickies.jpc.io/og-image.png" />

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <!-- Browser chrome (mobile address/status bar) matches the app background per
         scheme — otherwise it stayed a light colour in dark mode. Values are the
         light/dark --sk-bg tokens from theme/variables.css. -->
    <meta name="theme-color" content="#f6f3ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- add to homescreen for ios. Without an apple-touch-icon link, "Add to
         Home Screen" falls back to a blurry screenshot of the page instead of
         the app icon (the 180x180 PNG already ships in public/, just unlinked). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stickies" />
    <!-- translucent, not opaque `black`: the app's cream (light) / charcoal (dark)
         background shows through the status bar via the safe-area top padding
         (viewport-fit=cover + env(safe-area-inset-top) in theme/variables.css).
         `black` painted a solid black band above the cream toolbar when installed. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
