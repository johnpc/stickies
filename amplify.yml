version: 1
# Same build as the console spec, pinned to Node 26 (matches .nvmrc and CI).
backend:
  phases:
    preBuild:
      commands:
        # Node 26's official Linux binary links libatomic.so.1, which the
        # Amplify build image lacks (job 140: "error while loading shared
        # libraries: libatomic.so.1"). Verified on amazonlinux:2023: with
        # libatomic installed, node v26.13.1 runs.
        - if command -v dnf >/dev/null; then dnf install -y libatomic; else yum install -y libatomic; fi
        - nvm install 26
        - nvm use 26
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 26
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
